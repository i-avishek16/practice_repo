name: matrix-strategy-example

on:
  # Manual trigger
  workflow_dispatch:

  # Automatic trigger on push to main
  push:
    branches:
      - main

  # Automatic trigger on pull requests targeting main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.platform }}
    strategy:
      matrix:
        node-version: [14, 16, 18]
        platform: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          - platform: macos-latest
            node-version: 14
      fail-fast: false

    env:
      MONTH_OF_YEAR: September
      CURRENT_YEAR: 2026
      DEBUG: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Print environment info
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Actor: $GITHUB_ACTOR"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit SHA: $GITHUB_SHA"
          echo "Branch/Tag: $GITHUB_REF"
          echo "Month: $MONTH_OF_YEAR"
          echo "Year: $CURRENT_YEAR"

      - name: Conditional Debug Message
        if: env.DEBUG == 'true'
        run: echo "Debugging is enabled."

      - name: Final Success Message
        if: success()
        run: echo "Workflow executed Successfully ✅"
