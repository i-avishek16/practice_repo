name: simple-example

on:
  # Trigger workflow on push to any branch
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'   # Use latest Python 3

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Step 4: Run tests
      - name: Run unit tests
        run: |
          if [ -f tests/test_app.py ]; then pytest; else echo "No tests found"; fi

      # Step 5: Final success message
      - name: Final Success Message
        if: success()
        run: echo "Workflow executed Successfully ✅"
