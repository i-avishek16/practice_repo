name: Jobs and Steps Workflows

on:
  # Automatic trigger: runs on push to main branch
  push:
    branches:
      - main

  # Manual trigger: allows workflow to be run from Actions tab
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment (dev, staging, prod)'
        required: true
        default: 'dev'
      build_type:
        description: 'Type of build (debug or release)'
        required: false
        default: 'debug'

  # Scheduled trigger: runs at 5:00 AM UTC Monday–Friday
  schedule:
    - cron: '0 5 * * 1-5'

  # Pull request trigger: runs on PRs targeting main branch
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: latest   # Environment variable for Node.js version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Set deployment flag
        run: |
          echo "Checking test results..."
          echo "DEPLOYMENT=yes" >> $GITHUB_ENV

      - name: Conditional Deployment
        if: env.DEPLOYMENT == 'yes'
        run: echo "Deploying to ${{ github.event.inputs.environment }} with build type ${{ github.event.inputs.build_type }}..."

      - name: Always run cleanup
        if: always()
        run: echo "Cleanup step always runs"

      - name: Final Success Message
        if: success()
        run: echo "Workflow executed Successfully ✅"
